name: Automated KG Extraction Pipeline

on:
  push:
    branches:
      - github-actions
      - complete
  workflow_dispatch:

jobs:
  validate-kg-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pdfplumber

      - name: Show repository files
        run: |
          echo "Repository file structure:"
          find . -type f

      - name: Check Python script syntax
        run: |
          if [ -f "DeepSeek Output/scriptdeep.py" ]; then
            python -m py_compile "DeepSeek Output/scriptdeep.py"
          elif [ -f "script.py" ]; then
            python -m py_compile "script.py"
          else
            echo "No extraction Python script found."
            exit 1
          fi

      - name: List extraction output files
        run: |
          echo "Checking output folders..."
          ls -la
          if [ -d "DeepSeek Output" ]; then
            ls -la "DeepSeek Output"
          fi

      - name: Verify CSV output exists
        run: |
          if [ -f "DeepSeek Output/paper1_kg.csv" ]; then
            echo "CSV found in DeepSeek Output"
          elif [ -f "paper1_kg.csv" ]; then
            echo "CSV found in root folder"
          else
            echo "CSV output not found"
            exit 1
          fi

      - name: Verify JSON output exists
        run: |
          if [ -f "DeepSeek Output/paper1_kg.json" ]; then
            echo "JSON found in DeepSeek Output"
          elif [ -f "paper1_kg.json" ]; then
            echo "JSON found in root folder"
          else
            echo "JSON output not found"
            exit 1
          fi

      - name: Upload extraction outputs as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kg-extraction-results
          path: |
            DeepSeek Output/*.csv
            DeepSeek Output/*.json
            *.csv
            *.json
