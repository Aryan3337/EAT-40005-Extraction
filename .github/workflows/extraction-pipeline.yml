name: Automated KG Extraction Pipeline

on:
  push:
    branches:
      - github-actions
      - complete
    paths:
      - "DeepSeek Output/**"
      - "script.py"
      - ".github/workflows/extraction-pipeline.yml"

  workflow_dispatch:

jobs:
  validate-kg-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pdfplumber

      - name: Show repository files
        run: |
          pwd
          find . -type f

      - name: List extraction output files
        run: |
          echo "Checking DeepSeek output folder..."
          ls -la "DeepSeek Output"

      - name: Verify CSV output exists
        run: |
          test -f "DeepSeek Output/paper1_kg.csv"

      - name: Verify JSON output exists
        run: |
          test -f "DeepSeek Output/paper1_kg.json"

      - name: Upload extraction outputs as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kg-extraction-results
          path: |
            DeepSeek Output/*.csv
            DeepSeek Output/*.json
