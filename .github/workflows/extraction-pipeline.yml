name: Automated KG Extraction Pipeline

on:
  push:
    branches:
      - github-actions
      - complete
  workflow_dispatch:

jobs:
  validate-kg-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pdfplumber

      - name: Show repository files
        run: |
          echo "Repository file structure:"
          find . -type f

      - name: Check Python script syntax
        run: |
          python -m py_compile script.py

      - name: List extraction output files
        run: |
          echo "Checking repository files..."
          ls -la

      - name: Verify CSV output exists
        run: |
          if [ -f "paper1_kg_extractions.csv" ]; then
            echo "CSV output found"
          else
            echo "CSV output not found"
            exit 1
          fi

      - name: Upload extraction output as artifact
        uses: actions/upload-artifact@v4
        with:
          name: kg-extraction-results
          path: paper1_kg_extractions.csv
