# Nectar deployment: the whole chatbot on one m3.xlarge.
#
#   docker compose up -d --build
#
# Three containers. Only nginx publishes a port, so the security group
# needs 80 open (and 443 once TLS lands) and nothing else -- the API and
# Ollama are reachable only on the internal compose network.
#
# Decisions behind this file are in ../../NECTAR_MIGRATION.md.

services:
  ollama:
    image: ollama/ollama:latest
    container_name: p85_ollama
    # Models live on the attached volume, not the root disk, so they
    # survive an instance rebuild. ~4.7GB for mistral:7b.
    volumes:
      - /mnt/data/ollama:/root/.ollama
    # Deliberately NO ports: -- publishing 11434 would expose an
    # unauthenticated Ollama to the internet. The API reaches it over the
    # compose network instead.
    environment:
      # Never evict the model. Ollama's default is to unload after 5
      # minutes idle, and reloading 5GB from the attached volume is slow
      # enough that it pushed a question past nginx's 180s ceiling on
      # 2026-10-27 -- a 504 on the FIRST question of an 8-question
      # benchmark, with every later one answering fine because the model
      # was by then resident.
      #
      # That is the worst possible shape for a demo: a quiet period is
      # exactly what precedes the first question anyone asks, so the most
      # visible request is the one most likely to fail.
      #
      # Costs 5GB of RAM held permanently against the 31GB on this
      # flavour, ~20GB of which was free under full load during that
      # benchmark. This box does one job; there is nothing else to spend
      # that memory on.
      - OLLAMA_KEEP_ALIVE=-1
    restart: unless-stopped

  api:
    build:
      context: ../..
      dockerfile: Dockerfile.serve
    container_name: p85_api
    depends_on:
      - ollama
    env_file:
      - .env
    environment:
      # "ollama" is the compose service name. llm_endpoint.is_private_host
      # accepts any single-label hostname precisely so this works -- no
      # TRUSTED_LLM_HOST needed here, unlike the Render + tunnel setup,
      # because inference is on the same network rather than across the
      # public internet.
      - OLLAMA_URL=http://ollama:11434/api/generate
      - CONFIDENCE_OLLAMA_URL=http://ollama:11434/api/chat
      - OLLAMA_MODEL=mistral:7b
      - PORT=8000
      # rag.py:2206 reads UPLOADS_DIR and defaults it to a RELATIVE
      # "uploads", which under Dockerfile.serve's WORKDIR /app resolves to
      # /app/uploads -- the container's writable layer. Every admitted
      # paper and the whole review queue would then be destroyed by
      # `docker compose down`. Point it at the bind mount below instead.
      - UPLOADS_DIR=/app/uploads
    # No command: override. Dockerfile.serve's CMD is already
    #   python -u rag.py --serve --neo4j --host 0.0.0.0
    # which is exactly what the Neo4j/AuraDB path needs.
    #
    # Retrieval runs against AuraDB, not the CSVs. rag.py:2820 picks ONE
    # backend --
    #   skeleton = Neo4jRAGSkeleton() if use_neo4j else RAGSkeleton(kg_path)
    # -- so --neo4j makes every --kg flag dead. An earlier draft of this
    # file passed 12 of them; they did nothing. The CSVs stay in the image
    # (Dockerfile.serve's COPY data/) for load_production_graph.py and as
    # the clean 112-triple reference corpus, but they are not the read path.
    #
    # NEO4J_URI / NEO4J_USERNAME / NEO4J_PASSWORD come from .env. config.py
    # prepends neo4j+s:// to a bare Aura hostname and REFUSES an
    # unencrypted URI to a remote host, because sentence_ref carries
    # verbatim source-paper text.
    volumes:
      # Admin uploads and queue.jsonl on the attached volume, so they
      # survive `docker compose down` and an instance rebuild. Paired with
      # UPLOADS_DIR above -- the mount alone does nothing, because the
      # default path is /app/uploads only by coincidence of the WORKDIR.
      - /mnt/data/uploads:/app/uploads
    restart: unless-stopped

  web:
    image: nginx:alpine
    container_name: p85_web
    depends_on:
      - api
    ports:
      - "80:80"
      # 443 is not optional. Chrome's HTTPS-First rewrites http://<bare-ip>
      # to https:// before the request leaves the browser, so with nothing
      # listening here the site is unreachable in a current Chrome even
      # though curl gets 200 from port 80.
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # The Flutter web build output. See README.md for how to produce it.
      - ./web:/usr/share/nginx/html:ro
      # Certificates, on the attached volume so they survive `docker compose
      # down` and an instance rebuild. That is a rate-limit protection as
      # much as a convenience: sslip.io is NOT on the Public Suffix List, so
      # Let's Encrypt counts every *.sslip.io certificate on the internet
      # against one shared registered-domain limit. Re-issuing on every
      # restart is a good way to find that limit.
      - /mnt/data/letsencrypt:/etc/letsencrypt:ro
      - /mnt/data/certbot-www:/var/www/certbot:ro
    # Reload every 6h so a certificate renewed by the certbot service below
    # is actually picked up. nginx only reads its certificates at
    # start/reload, so without this a renewal lands on disk and the site
    # keeps serving the expired one until someone restarts it by hand.
    # The $$ is compose escaping for a literal $.
    command: >
      /bin/sh -c "while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g 'daemon off;'"
    restart: unless-stopped

  # Renews the certificate. Does nothing until init-letsencrypt.sh has
  # obtained one -- `certbot renew` with no certificates is a no-op, not an
  # error. The webroot path and domain are recorded in the renewal config at
  # issue time, so plain `renew` is correct here; passing -d or -w again
  # risks conflicting with what was stored.
  #
  # Twice daily is what Let's Encrypt asks for: renewal only acts inside the
  # last 30 days of a 90-day certificate, so the other ~120 runs exit
  # immediately, and the frequency is what absorbs a few days of downtime
  # without anything expiring.
  certbot:
    image: certbot/certbot:latest
    container_name: p85_certbot
    volumes:
      - /mnt/data/letsencrypt:/etc/letsencrypt
      - /mnt/data/certbot-www:/var/www/certbot
    entrypoint: >
      /bin/sh -c "trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done"
    restart: unless-stopped
