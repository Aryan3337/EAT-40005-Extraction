# Serves the Flutter web build and reverse-proxies the rag.py API, so the
# browser talks to one origin on port 80 and neither the API nor Ollama
# needs to be exposed to the internet.

server {
    listen 80;
    server_name _;

    # Admin PDF upload posts whole papers. nginx's 1m default would reject
    # them with a 413 before the request ever reached the API.
    client_max_body_size 32m;

    # The Flutter web build. try_files falls back to index.html so client
    # side routes resolve on a hard refresh instead of 404ing.
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # Every route rag.py actually serves. Enumerated rather than "proxy
    # anything that isn't a file" so a typo in a request path fails loudly
    # here instead of being quietly handed to the SPA fallback above.
    location ~ ^/(query|health|feedback|history|tts|auth/|admin/) {
        proxy_pass http://api:8000;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # MUST be longer than ANSWER_SYNTHESIS_TIMEOUT_SECONDS (130s in
        # rag.py). nginx defaults to 60s, which would cut off every real
        # synthesis call on CPU and surface it as a 504 -- looking like the
        # API is broken when it is simply still generating.
        proxy_connect_timeout  10s;
        proxy_send_timeout    180s;
        proxy_read_timeout    180s;

        # Answers are generated in one shot, not streamed; buffering is
        # fine and keeps slow clients off the API's worker threads.
        proxy_buffering on;
    }
}
