# Serves the Flutter web build and reverse-proxies the rag.py API, so the
# browser talks to one origin and neither the API nor Ollama needs to be
# exposed to the internet.
#
# TLS is not cosmetic here. Chrome's HTTPS-First silently rewrites
# http://<bare-ip>/ to https://, and if nothing answers on 443 the visitor
# gets a refused connection with no "continue anyway" to click -- the site
# is simply unreachable, while curl still gets 200 from port 80. Verified
# 2026-10-27. See ../../NECTAR_IMPLEMENTATION_PLAN.md P1.
#
# The certificate lives at live/p85/ rather than live/<domain>/ because
# certbot was run with --cert-name p85. That is deliberate: the domain is
# <instance-ip>.sslip.io, the IP is instance-bound, and a rebuild would
# otherwise change a path inside this file. With a fixed cert name, a
# rebuild needs init-letsencrypt.sh re-run and nothing in here touched.

# ---------------------------------------------------------------------------
# Port 80: ACME challenges, and a redirect for everything else.
# ---------------------------------------------------------------------------
server {
    listen 80;
    server_name _;

    # Let's Encrypt HTTP-01 writes its challenge token here and fetches it
    # over plain http. This block MUST come before the redirect below --
    # bounce the challenge to https and renewal fails every time, which
    # surfaces 90 days later as a dead site rather than as an error now.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # $host rather than a hard-coded name, so this file survives the
    # instance being rebuilt with a different IP. A visitor who typed the
    # bare IP lands on https://<ip>/, which this server answers with a
    # certificate issued for <ip>.sslip.io -- a name mismatch warning that
    # CAN be clicked through. The canonical URL to hand out is the
    # sslip.io one, which is warning-free.
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# Port 443: the actual site.
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/p85/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/p85/privkey.pem;

    # Mozilla "intermediate": TLS 1.2+ only, no renegotiation-era ciphers.
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Deliberately NO Strict-Transport-Security. HSTS is cached by the
    # browser for its max-age and cannot be withdrawn, and this deployment's
    # hostname is derived from an instance-bound IP that a rebuild changes.
    # Pinning a demo URL to https in every visitor's browser is a trap for
    # whoever inherits this.

    # Admin PDF upload posts whole papers. nginx's 1m default would reject
    # them with a 413 before the request ever reached the API.
    client_max_body_size 32m;

    # Never serve dotfiles from the web root. This is not hypothetical: on
    # 2026-10-27 a `.git` directory rode along inside the Flutter build
    # output and nginx served it, and a scanner had pulled /.git/config
    # within the hour. That repo turned out to hold only public build
    # artifacts, but the next one might not -- a served .git is a clonable
    # copy of whatever history it contains.
    #
    # The (?!well-known) is load-bearing: Let's Encrypt's HTTP-01 challenge
    # path also begins with a dot, and a blanket deny here would break
    # renewal silently, 90 days from now.
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    # The Flutter web build. try_files falls back to index.html so client
    # side routes resolve on a hard refresh instead of 404ing.
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # Every route rag.py actually serves. Enumerated rather than "proxy
    # anything that isn't a file" so a typo in a request path fails loudly
    # here instead of being quietly handed to the SPA fallback above.
    location ~ ^/(query|health|feedback|history|tts|auth/|admin/) {
        proxy_pass http://api:8000;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Now genuinely "https", which is what rag.py sees. It does not
        # currently read this header, but a successor adding secure-cookie
        # or redirect logic will need it to be honest.
        proxy_set_header X-Forwarded-Proto $scheme;

        # MUST be longer than ANSWER_SYNTHESIS_TIMEOUT_SECONDS (130s in
        # rag.py). nginx defaults to 60s, which would cut off every real
        # synthesis call on CPU and surface it as a 504 -- looking like the
        # API is broken when it is simply still generating.
        proxy_connect_timeout  10s;
        proxy_send_timeout    180s;
        proxy_read_timeout    180s;

        # Answers are generated in one shot, not streamed; buffering is
        # fine and keeps slow clients off the API's worker threads.
        proxy_buffering on;
    }
}
